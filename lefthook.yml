# Fast gate: runs at every commit, must stay under roughly 30 seconds.
pre-commit:
  parallel: false
  commands:
    typecheck:
      run: pnpm typecheck
    biome:
      run: pnpm biome ci .
    eslint:
      run: pnpm eslint .
    unit-tests:
      run: pnpm vitest run --project unit
    knip:
      run: pnpm knip --no-progress

# Slow local gate: runs at every push and includes integration tests.
pre-push:
  parallel: false
  commands:
    integration-tests:
      run: pnpm test:integration
