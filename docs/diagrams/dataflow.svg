<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" role="img" aria-labelledby="agr-title agr-desc">
  <title id="agr-title">Audit-Grade RAG Data Flow</title>
  <desc id="agr-desc">Query flows through retrieval with pgvector/bge-m3, refusal gate, Claude generation, signed ledger, and deterministic replay verification with five named drift states.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a855f7"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
    </marker>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="820" fill="url(#bg-grad)"/>

  <text x="480" y="38" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="17" font-weight="700" fill="#e2e8f0" letter-spacing="0.02em">Audit-Grade RAG -- Data Flow</text>

  <rect x="350" y="60" width="260" height="50" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="82" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="13" font-weight="700" fill="#e2e8f0">Query</text>
  <text x="480" y="99" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" fill="#94a3b8">operator console</text>
  <path stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arr-blue)" d="M480,110 L480,138"/>
  <rect x="350" y="140" width="260" height="50" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="162" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="13" font-weight="700" fill="#e2e8f0">Embed</text>
  <text x="480" y="179" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" fill="#94a3b8">bge-m3 dense vectors</text>
  <path stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arr-blue)" d="M480,190 L480,218"/>
  <rect x="350" y="220" width="260" height="50" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text x="480" y="242" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="13" font-weight="700" fill="#e2e8f0">Retrieve</text>
  <text x="480" y="259" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" fill="#94a3b8">pgvector  /  BM25  /  RRF merge</text>
  <rect x="700" y="220" width="180" height="50" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="790" y="242" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="12" font-weight="700" fill="#10b981">pgvector</text>
  <text x="790" y="259" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="10" fill="#94a3b8">corpus snapshot</text>
  <path stroke="#10b981" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr-green)" d="M700,245 L612,245"/>
  <rect x="636" y="234" width="62" height="14" rx="3" fill="#0f0f1a" opacity="0.9"/>
  <text x="667" y="245" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="10" fill="#10b981">chunks</text>
  <path stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arr-blue)" d="M480,270 L480,298"/>
  <rect x="330" y="300" width="300" height="68" rx="6" fill="#1c0a00" stroke="#f97316" stroke-width="2"/>
  <text x="480" y="322" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="13" font-weight="700" fill="#f97316">Refusal Gate</text>
  <text x="480" y="340" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" fill="#94a3b8">out-of-corpus check  /  evidence threshold</text>
  <text x="480" y="357" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" fill="#94a3b8">below threshold  ->  refuse before LLM call</text>
  <rect x="60" y="305" width="200" height="58" rx="6" fill="#3b0000" stroke="#ef4444" stroke-width="1.5"/>
  <text x="160" y="330" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="12" font-weight="700" fill="#ef4444">REFUSE</text>
  <text x="160" y="348" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="10" fill="#94a3b8">ledger row: refused</text>
  <text x="160" y="362" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="10" fill="#94a3b8">no LLM call</text>
  <path stroke="#ef4444" stroke-width="1.5" fill="none" marker-end="url(#arr-red)" d="M330,334 L262,334"/>
  <rect x="266" y="325" width="68" height="14" rx="3" fill="#0f0f1a" opacity="0.9"/>
  <text x="300" y="336" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="10" fill="#ef4444">low score</text>
  <path stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arr-blue)" d="M480,368 L480,398"/>
  <rect x="440" y="372" width="82" height="14" rx="3" fill="#0f0f1a" opacity="0.9"/>
  <text x="481" y="383" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="10" fill="#3b82f6">above threshold</text>
  <rect x="350" y="400" width="260" height="50" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" filter="url(#glow-purple)"/>
  <text x="480" y="422" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="13" font-weight="700" fill="#e2e8f0">Generate</text>
  <text x="480" y="439" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" fill="#a855f7">Claude  /  cited answer  /  claim validate</text>
  <path stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#arr-purple)" d="M480,450 L480,488"/>
  <rect x="340" y="490" width="280" height="60" rx="6" fill="#052e16" stroke="#10b981" stroke-width="2" filter="url(#glow-green)"/>
  <text x="480" y="512" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="13" font-weight="700" fill="#10b981">Hash-Chained Signed Ledger</text>
  <text x="480" y="529" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" fill="#94a3b8">append-only  /  hash-chain  /  signed row</text>
  <text x="480" y="545" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" fill="#94a3b8">events: answered  refused  blocked  replayed</text>
  <path stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arr-green)" d="M480,550 L480,568"/>
  <rect x="330" y="570" width="300" height="70" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="480" y="590" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="13" font-weight="700" fill="#a855f7">Deterministic Replay + Drift Verify</text>
  <text x="480" y="608" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" fill="#94a3b8">checks: prompt-hash  corpus-snapshot  model-artifact</text>
  <text x="480" y="624" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" fill="#94a3b8">cloud-byte  unsupported-provider</text>
  <text x="480" y="638" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="10" fill="#475569">Article 50 report bundle  |  reproducible from local state</text>
  <rect x="700" y="490" width="210" height="148" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="805" y="508" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" font-weight="700" fill="#eab308">5 Drift States</text>
  <text x="714" y="526" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" fill="#94a3b8">- prompt-hash</text>
  <text x="714" y="548" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" fill="#94a3b8">- corpus-snapshot</text>
  <text x="714" y="570" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" fill="#94a3b8">- model-artifact</text>
  <text x="714" y="592" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" fill="#94a3b8">- cloud-byte</text>
  <text x="714" y="614" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" fill="#94a3b8">- unsupported-provider</text>
  <path stroke="#a855f7" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#arr-purple)" d="M630,605 L698,564"/>
  <rect x="628" y="590" width="72" height="14" rx="3" fill="#0f0f1a" opacity="0.9"/>
  <text x="664" y="601" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="10" fill="#a855f7">drift named</text>
  <rect x="60" y="730" width="840" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="746" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="11" font-weight="700" fill="#475569">LEGEND</text>
  <line x1="90" y1="767" x2="118" y2="767" stroke="#3b82f6" stroke-width="2"/>
  <text x="123" y="771" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="10" fill="#94a3b8">primary data flow</text>
  <line x1="250" y1="767" x2="278" y2="767" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="283" y="771" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="10" fill="#94a3b8">memory read (retrieval)</text>
  <line x1="410" y1="767" x2="438" y2="767" stroke="#a855f7" stroke-width="2"/>
  <text x="443" y="771" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="10" fill="#94a3b8">LLM / audit path</text>
  <line x1="570" y1="767" x2="598" y2="767" stroke="#ef4444" stroke-width="2"/>
  <text x="603" y="771" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="10" fill="#94a3b8">refusal branch</text>
  <line x1="730" y1="767" x2="758" y2="767" stroke="#f97316" stroke-width="2"/>
  <text x="763" y="771" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="10" fill="#94a3b8">control / gate</text>
  <text x="480" y="790" text-anchor="middle" font-family="SF Mono,Fira Code,Cascadia Code,Courier New,monospace" font-size="10" fill="#10b981">Ledger + Replay is the differentiator -- every answer is reproducibly verifiable</text>
</svg>