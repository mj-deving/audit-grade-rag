name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: audit_grade_rag
          POSTGRES_USER: audit_grade_rag
          POSTGRES_PASSWORD: audit_grade_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit_grade_rag -d audit_grade_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://audit_grade_rag:audit_grade_rag@127.0.0.1:5432/audit_grade_rag
      TYPST_VERSION: 0.13.1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install report verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install "/tmp/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          typst --version
          pdftotext -v
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Detect e2e browser tool
        id: browser
        run: |
          node -e "
            const p=require('./package.json');
            const all={...(p.dependencies||{}),...(p.devDependencies||{})};
            const has=k=>k in all?'true':'false';
            process.stdout.write('playwright='+has('@playwright/test')+'\n');
            process.stdout.write('agentBrowser='+has('agent-browser')+'\n');
          " | tee -a "$GITHUB_OUTPUT"
      - name: Install Playwright browsers
        if: steps.browser.outputs.playwright == 'true'
        run: pnpm playwright install --with-deps chromium
      - name: Install Chrome for Testing (agent-browser)
        if: steps.browser.outputs.agentBrowser == 'true'
        run: pnpm exec agent-browser install --with-deps
      - name: Full gate
        run: pnpm check:full

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # pnpm audit targets an npm endpoint that now returns 410, so scan the lockfile with
      # osv-scanner (pinned image) and gate on HIGH/CRITICAL only. osv-scanner exits 0 (no
      # vulns) or 1 (vulns found) on a successful scan; any other exit is an infra/parse
      # failure and must fail the job rather than pass with an empty report (fail closed).
      - name: Scan lockfile with osv-scanner
        run: |
          set +e
          docker run --rm -v "${{ github.workspace }}:/src" ghcr.io/google/osv-scanner:v1.9.2 \
            --lockfile=/src/pnpm-lock.yaml --format=json --output=/src/osv.json
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "osv-scanner failed with exit $code (not a vuln result); failing closed" >&2
            exit "$code"
          fi
      - name: Gate on HIGH/CRITICAL advisories
        run: pnpm exec tsx scripts/osv-check.ts osv.json
